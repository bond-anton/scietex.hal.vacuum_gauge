[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scietex.hal.vacuum_gauge"
dynamic = ["version"]
description = "Scietex Vacuum Gauge HAL package"
authors = [
  { name = "Anton Bondarenko", email = "bond.anton@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "scietex.hal.analog-sensor >= 1.0.0, < 2.0.0",
    "scietex.hal.serial >= 2.0.0, < 3.0.0",
    "pymodbus[serial] ~= 3.15",
]

[project.entry-points."scietex.hal.vacuum_gauge.drivers"]
thyracont_modbus_v1 = "scietex.hal.vacuum_gauge.thyracont.modbus.v1:ThyracontModbusV1Gauge"
thyracont_modbus_v2 = "scietex.hal.vacuum_gauge.thyracont.modbus.v2:ThyracontModbusV2Gauge"
thyracont_rs485_v2 = "scietex.hal.vacuum_gauge.thyracont.rs485.v2:ThyracontRS485V2Gauge"
erstevak_modbus_v1 = "scietex.hal.vacuum_gauge.erstevak.modbus.v1:ErstevakModbusV1Gauge"
erstevak_modbus_v2 = "scietex.hal.vacuum_gauge.erstevak.modbus.v2:ErstevakModbusV2Gauge"
erstevak_rs485_v2 = "scietex.hal.vacuum_gauge.erstevak.rs485.v2:ErstevakRS485V2Gauge"

[project.urls]
"Homepage" = "https://github.com/bond-anton/scietex.hal.vacuum_gauge"
"Bug Tracker" = "https://github.com/bond-anton/scietex.hal.vacuum_gauge/issues"

[project.optional-dependencies]
dev = []
test = ["pytest", "pytest-asyncio"]
lint = ["ruff", "ty"]

[tool.setuptools.dynamic]
version = {attr = "scietex.hal.vacuum_gauge.version.__version__"}

[tool.setuptools.package-data]
"scietex.hal.vacuum_gauge" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
